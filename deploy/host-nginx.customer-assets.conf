# Host-level Nginx site for serving customer-assets over HTTPS on a dedicated
# port, reusing an existing Let's Encrypt certificate on the ECS host.
#
# Use when ports 80/443 already belong to another site on the host Nginx.
# The compose proxy stays bound to 127.0.0.1:${APP_PROXY_PORT:-8080}.
#
# Install (as root):
#   cp deploy/host-nginx.customer-assets.conf /etc/nginx/sites-available/customer-assets
#   # edit ssl_certificate paths below if /etc/letsencrypt/live/<name> differs
#   ln -s /etc/nginx/sites-available/customer-assets /etc/nginx/sites-enabled/customer-assets
#   nginx -t && systemctl reload nginx
#
# Then open TCP 8443 in the ECS security group and browse to
#   https://<ECS public IP>:8443

server {
    # "ssl http2" on the listen line works on both older distro Nginx (<1.25)
    # and newer ones (where it only prints a deprecation warning).
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/101.37.211.157/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/101.37.211.157/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:customer_assets_ssl:10m;
    ssl_session_timeout 1d;

    # Host Nginx defaults to 1m, which would reject ABC Excel uploads.
    # Keep in line with deploy/nginx.production.conf (25m) and EXCEL_MAX_FILE_SIZE_MB.
    client_max_body_size 25m;
    client_body_timeout 300s;
    send_timeout 300s;

    # A plain-HTTP request to the TLS port gets a redirect instead of a 400.
    error_page 497 =301 https://$host:8443$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
